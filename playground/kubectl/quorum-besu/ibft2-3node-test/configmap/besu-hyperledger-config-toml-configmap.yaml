apiVersion: v1
kind: ConfigMap
metadata:
  name: besu-hyperledger-config-toml-configmap
  labels:
    app: besu-hyperledger-config-toml-configmap
  namespace: besu
data:
  config.toml: |-
    # Every possible CLI should be in this file.
    #
    # Please use a plausible value, besu has to at least be able to parse it.
    # If it is a multi-valued CLI make it a TOML array.
    # If it is a number or boolean make it a number or boolean
    # All other config options are strings, and must be quoted.

    # Node Information
    data-path="/data"
    genesis-file="/etc/genesis/genesis.json"

    # TODO : insert as command line & mount Volume
    # rpc-http-authentication-credentials-file="none"
    # TODO : insert as command line & mount Volume
    # rpc-ws-authentication-credentials-file="none"

    logging="INFO"

    min-gas-price=0
    #sync-mode="FULL"
    sync-mode="FAST"
    fast-sync-min-peers=2

    # P2P network
    p2p-enabled=true
    discovery-enabled=true
    #p2p-host="0.0.0.0"
    p2p-port=30303
    
    max-peers=5
    Xp2p-peer-lower-bound=5
    # https://besu.hyperledger.org/public-networks/how-to/connect/manage-peers
    remote-connections-limit-enabled=false
    random-peer-priority-enabled=true

    host-allowlist=["*"]

    # JSON-RPC
    rpc-http-enabled=true
    rpc-http-host="0.0.0.0"
    rpc-http-port=8545
    rpc-http-api=["ADMIN","DEBUG","TRACE","ETH","WEB3","IBFT","NET","TXPOOL"]
    rpc-http-cors-origins=["*"]
    rpc-http-authentication-enabled=false
    rpc-http-max-active-connections=1000

    # GRAPHQL-RPC
    graphql-http-enabled=false
    graphql-http-host="0.0.0.0"
    graphql-http-port=8547
    graphql-http-cors-origins=["*"]

    # WebSockets API
    rpc-ws-enabled=true
    rpc-ws-host="0.0.0.0"
    rpc-ws-port=8546
    rpc-ws-api=["ETH","NET","WEB3"]
    rpc-ws-authentication-enabled=false

    # Metrics
    metrics-enabled=true
    metrics-host="0.0.0.0"
    metrics-port=9545
    metrics-category=["BLOCKCHAIN","ETHEREUM","EXECUTORS","JVM","NETWORK","PEERS","PERMISSIONING","PROCESS","PRUNER","RPC","STRATUM","SYNCHRONIZER","TRANSACTION_POOL","KVSTORE_ROCKSDB","KVSTORE_ROCKSDB_STATS"]

    # Permissioning
    #permissions-accounts-config-file-enabled=false
    #permissions-nodes-config-file-enabled=false

    # ETC
    auto-log-bloom-caching-enabled=true
    revert-reason-enabled=false

    # Transaction Pool
    #tx-pool="legacy"
    #tx-pool-retention-hours=1
    #tx-pool-max-size=1024

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blockscout
  labels:
    app: blockscout
  namespace: blockscout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blockscout
  template:
    metadata:
      labels:
        app: blockscout
    spec:
      containers:
        - name: blockscout
          #image: blockscout/blockscout:4.1.2
          #image: cogod144/blockscout:v5.1.2
          image: blockscout/blockscout:5.1.2
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 2048m
              memory: 2048Mi
            limits:
              cpu: 2048m
              memory: 4096Mi
          env:
            - name: ENABLE_RUST_VERIFICATION_SERVICE
              value: "false"
            - name: VISUALIZE_SOL2UML_ENABLED
              value: "false"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ADDRESS_COUNT_CACHE_PERIOD
              valueFrom:
                configMapKeyRef:
                  key: ADDRESS_COUNT_CACHE_PERIOD
                  name: common-blockscout-env-old
            - name: ADDRESS_SUM_CACHE_PERIOD

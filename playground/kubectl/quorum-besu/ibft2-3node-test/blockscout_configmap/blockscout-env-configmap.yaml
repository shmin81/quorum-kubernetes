  ### (common env) General
  ## EMISSION_FORMAT: DEFAULT
  #CHAIN_SPEC_PATH: "" # x
  #SUPPLY_MODULE: ""
  ## POOL_SIZE: "30"  # 
  ## POOL_SIZE_API: "30" # 
  ECTO_USE_SSL: "false"
  ## HEART_BEAT_TIMEOUT: "60"
  #HEART_COMMAND: ""
  #ELIXIR_VERSION: ""
  #GRAPHIQL_TRANSACTION: ""
  DISABLE_WEBAPP: "false"
  DISABLE_READ_API: "false" 
  DISABLE_WRITE_API: "true" # verified contract??
  #WEBAPP_URL: "" # what mean?
  #API_URL: ""    # what mean?
  WOBSERVER_ENABLED: "false" # metrics : need enable ?
  ## CHECKSUM_ADDRESS_HASHES: "true"
  ## CHECKSUM_FUNCTION: eth
  #RESTRICTED_LIST
  #RESTRICTED_LIST_KEY
  #HEALTHY_BLOCKS_PERIOD: "5m"
  #NEW_TAGS:
  #CUSTOM_CONTRACT_ADDRESSES_${tag_name}: ""
  #API_V2_ENABLED: ""
  #V TOKEN_ID_MIGRATION_FIRST_BLOCK: "0"
  #V TOKEN_ID_MIGRATION_CONCURRENCY: "1"
  #V TOKEN_ID_MIGRATION_BATCH_SIZE: "500" 
  #SESSION_COOKIE_DOMAIN: ""
  #DECODE_NOT_A_CONTRACT_CALLS: "false"

  ### Indexer management
  #BLOCK_TRANSFORMER: base
  DISABLE_INDEXER: "false"
  INDEXER_DISABLE_PENDING_TRANSACTIONS_FETCHER: "true" # not need?
  INDEXER_DISABLE_INTERNAL_TRANSACTIONS_FETCHER: "false"
  INDEXER_DISABLE_BLOCK_REWARD_FETCHER: "true" # not need?
  #INDEXER_DISABLE_ADDRESS_COIN_BALANCE_FETCHER: "false"
  #INDEXER_DISABLE_CATALOGED_TOKEN_UPDATER_FETCHER: "false" # not need?
  #INDEXER_MEMORY_LIMIT: "1gb" # default 1gb (need higher?)
  INDEXER_MEMORY_LIMIT: "512mb" # need higher (mb, gb 만 가능)
  #V INDEXER_EMPTY_BLOCKS_SANITIZER_BATCH_SIZE: "100" # Batch size for empty block sanitizer (re-fetcher).
  #V INDEXER_CATCHUP_BLOCKS_BATCH_SIZE: "10" # Batch size for blocks catchup fetcher. 
  #V INDEXER_CATCHUP_BLOCKS_CONCURRENCY: "10" # Concurrency for blocks catchup fetcher.
  #INDEXER_DISABLE_EMPTY_BLOCKS_SANITIZER: "false"
  #
  #DISABLE_REALTIME_INDEXER: "false" 
  #FIRST_BLOCK: "0"
  #LAST_BLOCK: ""
  #TRACE_FIRST_BLOCK: "0"
  #TRACE_LAST_BLOCK: ""
  #BLOCK_RANGES: ??
  #FETCH_REWARDS_WAY: "trace_block"
  #ETHEREUM_JSONRPC_DEBUG_TRACE_TRANSACTION_TIMEOUT: "5s" # geth에서만 사용되는 듯
  #ETHEREUM_JSONRPC_DISABLE_ARCHIVE_BALANCES: "false"
  #ETHEREUM_JSONRPC_PENDING_TRANSACTIONS_TYPE: "default"  # how to besu??
  #
  #DISABLE_TOKEN_INSTANCE_FETCHER: "false"
  #V INDEXER_INTERNAL_TRANSACTIONS_BATCH_SIZE: "10"
  #V INDEXER_INTERNAL_TRANSACTIONS_CONCURRENCY: "4"
  #V INDEXER_BLOCK_REWARD_BATCH_SIZE: "10"
  #V INDEXER_BLOCK_REWARD_CONCURRENCY: "4"
  #V INDEXER_TOKEN_INSTANCE_BATCH_SIZE: "1"
  #V INDEXER_TOKEN_INSTANCE_CONCURRENCY: "10"
  #V INDEXER_RECEIPTS_BATCH_SIZE: "250"
  #V INDEXER_RECEIPTS_CONCURRENCY: "10"
  #V INDEXER_COIN_BALANCES_BATCH_SIZE: "500"
  #V INDEXER_COIN_BALANCES_CONCURRENCY: "4"
  #
  #INDEXER_TX_ACTIONS_ENABLE: "false" # 무슨 기능일까??
  #INDEXER_TX_ACTIONS_MAX_TOKEN_CACHE_SIZE: "100000"
  #INDEXER_TX_ACTIONS_REINDEX_FIRST_BLOCK: ""
  #INDEXER_TX_ACTIONS_REINDEX_LAST_BLOCK: ""
  #INDEXER_TX_ACTIONS_REINDEX_PROTOCOLS: ""
  #INDEXER_CATCHUP_MISSING_RANGES_BATCH_SIZE: "100000"
  #MIN_MISSING_BLOCK_NUMBER_BATCH_SIZE: "100000"
  #INDEXER_INTERNAL_TRANSACTIONS_TRACER_TYPE: "call_tracer"

  ### Exchange rates management
  DISABLE_EXCHANGE_RATES: "true"
  # ...
  #DISABLE_TOKEN_EXCHANGE_RATE: "true" # 필요한가??

  ### Cache management (최적화 필요할 듯)
  #CACHE_TXS_COUNT_PERIOD: "2h"
  # ...

  ### Gas price oracle management (price가 0이므로 리소스 최소화 방안은 ??)
  GAS_PRICE_ORACLE_NUM_OF_BLOCKS: "2" # default: 200 (resource down)
  #GAS_PRICE_ORACLE_SAFELOW_PERCENTILE: "35"
  #GAS_PRICE_ORACLE_AVERAGE_PERCENTILE: "60"
  #GAS_PRICE_ORACLE_FAST_PERCENTILE: "90"
  GAS_PRICE_ORACLE_CACHE_PERIOD: "2h" # default: 30s (resource down)

  ### Main page dashboard management
  GAS_PRICE: "0" # default "" (우리는 free gas network)
  ENABLE_TXS_STATS: "true"
  SHOW_PRICE_CHART: "false"
  SHOW_TXS_CHART: "true"
  HISTORY_FETCH_INTERVAL: "10m" # default 1h => 얼마나 자주 업데이트할지?
  #TXS_HISTORIAN_INIT_LAG: "0"
  TXS_STATS_DAYS_TO_COMPILE_AT_INIT: "30" # 메인 페이지의 일별 txs 수 기록 차트에 표시하기 위해 일별 txs 수 기록을 가져오는 일수입니다.

  ### Contract management
  CONTRACT_VERIFICATION_ALLOWED_EVM_VERSIONS: "homestead, tangerineWhistle, spuriousDragon, byzantium, constantinople, petersburg, istanbul"
  #CONTRACT_VERIFICATION_MAX_LIBRARIES: "" # default 10
  CONTRACT_MAX_STRING_LENGTH_WITHOUT_TRIMMING: "2040"
  CONTRACT_DISABLE_INTERACTION: "true" # default false (if JWT Auth, true only)

  ### Misc UI management
  SHOW_ADDRESS_MARKETCAP_PERCENTAGE: "false" # 수정
  SHOW_MAINTENANCE_ALERT: "false"
  MAINTENANCE_ALERT_MESSAGE: ""  # 익스플로러 상단 공지사항의 메시지 텍스트입니다.
  HIDE_BLOCK_MINER: "false"  # 값이 'true'인 경우 블록 페이지 및 타일에서 광부/검증기/시퀀서를 숨깁니다.
  DISPLAY_TOKEN_ICONS: "false" # true인 경우 TrustWallet 자산 저장소의 토큰 아이콘을 표시.
  UNCLES_IN_AVERAGE_BLOCK_TIME: "false" # 우리는 엉클 블록이 없음
  COIN_BALANCE_HISTORY_DAYS: "1" # default 10 : token 창의 하단 메뉴 중 하나에 관련된 것인듯? -> DB 조회 조건
  ADMIN_PANEL_ENABLED: "false"  # 
  DISABLE_ADD_TO_MM_BUTTON: "true" # true인 경우 MetaMask에 체인 추가" 버튼이 나타나지 않음
  #PERMANENT_DARK_MODE_ENABLED: "false" 
  #PERMANENT_LIGHT_MODE_ENABLED: "false"

  ### API rate limit management
  API_RATE_LIMIT: "30" # 전역 API 속도 제한: 모든 사용자에 대한 초당 요청 수 또는 요청.
  ## API_RATE_LIMIT_BY_KEY: "50"
  ## API_RATE_LIMIT_BY_IP: "50"
  ## API_RATE_LIMIT_STATIC_API_KEY: ""
  ## API_RATE_LIMIT_WHITELISTED_IPS: ""
  #API_RATE_LIMIT_DISABLED: "false"

  ### Specific smart-contracts

  ### Account-related ENV variables
  ACCOUNT_ENABLED: "false"
  # ...
  
  ### Smart-contract verifier 
  ENABLE_RUST_VERIFICATION_SERVICE: "false"
  RUST_VERIFICATION_SERVICE_URL: "http://smart-contract-verifier.blockscout:8050"

  ### Sol2Uml => code를 verify하여, solidity code가 연결되어야 실행 버튼이 보임
  VISUALIZE_SOL2UML_ENABLED: "false"
  VISUALIZE_SOL2UML_SERVICE_URL: "http://visualizer.blockscout:8050"

  ### Sourcify : (with smart-contract-verifier)
  ENABLE_SOURCIFY_INTEGRATION: "false"
  SOURCIFY_REPO_URL: "https://repo.sourcify.dev/contracts/"
  SOURCIFY_SERVER_URL: "https://sourcify.dev/server"

  ### Sig-provider => 뭐하는 것인지 모르겠음 (제외)

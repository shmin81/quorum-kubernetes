---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgre
  labels:
    app: postgre
  namespace: blockscout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgre
  template:
    metadata:
      labels:
        app: postgre
    spec:
      containers:
        - name: postgre
          image: postgres:14
          imagePullPolicy: IfNotPresent
          # 공유 버퍼의 크기는 기본 32M 이지만, 서버 메모리 기준으로 1/4 ~ 1/2 정도로 할당
          args: ["-c", "shared_buffers=256MB", "-c", "max_connections=200"]
          resources:
            requests:
              cpu: 1024m
              memory: 1024Mi
            limits:
              cpu: 1024m
              memory: 1024Mi
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POSTGRES_HOST_AUTH_METHOD
              value: "trust"
            - name: POSTGRES_PASSWORD
              value: "postgre"
            - name: POSTGRES_USER
              value: "postgre"
            - name: POSTGRES_DB
              value: blockscout
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
          ports:
            - containerPort: 5432
      volumes:
        - name: db-data
          emptyDir:
            sizeLimit: "30Gi"

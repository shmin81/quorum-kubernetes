---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: visualizer
  labels:
    app: visualizer
  namespace: blockscout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: visualizer
  template:
    metadata:
      labels:
        app: visualizer
    spec:
      containers:
        - name: visualizer
          image: ghcr.io/blockscout/visualizer:main
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 256m
              memory: 256Mi
            limits:
              cpu: 512m
              memory: 512Mi
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: VISUALIZER__SERVER__GRPC__ENABLED
              value: "false"
          ports:
            - containerPort: 8050
              name: http
              protocol: TCP
      restartPolicy: Always

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sig-provider
  labels:
    app: sig-provider
  namespace: blockscout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sig-provider
  template:
    metadata:
      labels:
        app: sig-provider
    spec:
      containers:
        - name: sig-provider
          image: ghcr.io/blockscout/sig-provider:main
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 256m
              memory: 256Mi
            limits:
              cpu: 512m
              memory: 512Mi
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: VISUALIZER__SERVER__GRPC__ENABLED
              value: "false"
          ports:
            - containerPort: 8050
              name: http
              protocol: TCP
      restartPolicy: Always

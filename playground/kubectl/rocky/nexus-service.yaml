apiVersion: v1
kind: Service
metadata:
  name: besu-nexus3u
  labels:
    app: nexus3u
  namespace: besu
spec:
  type: NodePort
  selector:
    app: nexus3u
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30881
      protocol: TCP
      name: nexus3u-http

---
apiVersion: v1
kind: Service
metadata:
  name: besu-nexus3u-0
  labels:
    app: nexus3u
  namespace: besu
spec:
  type: ClusterIP
  selector:
    app: nexus3u
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: nexus3u-http-in
